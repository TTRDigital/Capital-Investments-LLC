# Loads the site's built-in content and images into Sanity (project 850gl5j0),
# so /cms starts full. Run it from the browser: Actions > "Load content into
# Sanity" > Run workflow. Nothing to install or run on a computer.
#
# Needs the repository secret SANITY_WRITE_TOKEN (Settings > Secrets and
# variables > Actions): an Editor token from sanity.io/manage > project >
# API > Tokens. Delete or rotate the token once the content is loaded.
name: Load content into Sanity

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "add-missing: only create what is not in Sanity yet. overwrite: replace everything with the built-in content (edits made in /cms are lost). dry-run: check only, write nothing."
        type: choice
        options: [add-missing, overwrite, dry-run]
        default: add-missing

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Load content
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$SANITY_WRITE_TOKEN" ] && [ "$MODE" != "dry-run" ]; then
            echo "::error::Add the SANITY_WRITE_TOKEN secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          case "$MODE" in
            overwrite) npm run seed -- --force ;;
            dry-run) npm run seed -- --dry-run ;;
            *) npm run seed ;;
          esac
